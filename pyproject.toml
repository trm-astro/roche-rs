[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "roche"
version = "0.5.6"
requires-python = ">=3.8"
readme = "README.md"

[tool.maturin]
features = ["pyo3/extension-module", "pyo3/abi3-py38"]


[dependency-groups]
dev = [
    { include-group = "docs" },
]

docs = [
    "sphinx",
    "myst-nb",
    "myst-parser",
    "pydata-sphinx-theme",
    "numpydoc",
]